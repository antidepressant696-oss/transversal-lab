<title>Transversal Lab — Мой профиль</title>
<style>
:root{--bg:#f6faf9;--panel:#fff;--text:#17312e;--muted:#647773;--line:#dce9e6;--accent:#2f7d73;--soft:#e9f4f1;--warn:#fbf6e9}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px 20px}
.nav{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:18px}
.brand{font-weight:800;color:var(--accent);text-decoration:none;letter-spacing:.04em}
.navright{display:flex;align-items:center;gap:12px}.nav a{color:var(--text);text-decoration:none;font-size:14px}
select{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--text)}
main{max-width:1120px;margin:auto;padding:36px 20px 50px}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--accent)}
h1{font-size:34px;line-height:1.15;margin:10px 0 8px}.lead{max-width:820px;color:var(--muted);line-height:1.6}
.notice{margin:22px 0 28px;padding:17px 19px;border:1px solid #cfe5e1;background:var(--soft);border-radius:16px;line-height:1.55}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.kpi strong{display:block;font-size:24px;margin-top:4px}.kpi span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}
.card h2{margin:0 0 4px;font-size:21px}.sub{color:var(--muted);font-size:13px;line-height:1.45}
.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#f0f6f5;color:#355b56;font-size:12px;font-weight:750;margin:9px 0 12px}
.status.done{background:#e8f4ef;color:#276453}.status.todo{background:#f1f4f3;color:#75827e}
.meter{height:7px;background:#edf2f1;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:#77b8aa;width:0}
.evidence{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{padding:6px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--soft);color:#276453}.tag.candidate{background:var(--warn);color:#7b652e}
.details{margin-top:14px}.details summary{cursor:pointer;color:#2d6a5a;font-weight:700;font-size:13px}
ul{padding-left:20px;margin:10px 0 0;color:var(--muted);line-height:1.55}
.empty{color:var(--muted);font-size:13px;margin-top:9px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-block;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:750;border:1px solid var(--line);color:var(--text);background:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
footer{max-width:1120px;margin:auto;padding:0 20px 40px;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:900px){.overview{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.grid{grid-template-columns:1fr}.overview{grid-template-columns:1fr 1fr}.nav{align-items:flex-start}.navright{flex-wrap:wrap;justify-content:flex-end}}

/* ===== Global role navigation ===== */
.tl-role-nav{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tl-role-label{font-size:10px;line-height:1;color:var(--muted,#647773);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.tl-nav-link{display:inline-flex;align-items:center;min-height:32px;padding:7px 9px;border-radius:9px;color:var(--text,#17312e);text-decoration:none;font-size:13px;font-weight:700}
.tl-nav-link:hover{background:var(--soft,#e9f4f1)}
.tl-nav-link.active{background:var(--soft,#e9f4f1);color:var(--accent,#2f7d73)}
.tl-divider{width:1px;height:22px;background:var(--line,#dce9e6);margin:0 4px}
@media(max-width:900px){.tl-role-nav{justify-content:flex-end;gap:5px}.tl-role-label{width:100%;text-align:right;margin:3px 0 0}.tl-divider{display:none}}


/* v1.5 navigation stability: CSS-only fix */
.tl-header{position:sticky!important;top:0!important;z-index:2000!important;background:#fff!important}
.tl-root-header{width:min(1160px,100%);margin:0 auto;min-height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.root-actions,.navright{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:10px!important;flex-wrap:nowrap!important;position:relative!important;z-index:2100!important}
.root-actions>* , .navright>*{position:relative!important;z-index:2101!important;pointer-events:auto!important}
.tl-role-nav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:relative!important;z-index:2101!important}
.tl-nav-link{position:relative!important;z-index:2102!important;pointer-events:auto!important;cursor:pointer!important}
.tl-global-right{position:relative!important;z-index:2102!important;pointer-events:auto!important;display:flex!important;align-items:center!important;gap:10px!important;white-space:nowrap!important}
.tl-global-link,.tl-global-lang{position:relative!important;z-index:2103!important;pointer-events:auto!important;cursor:pointer!important}
@media(max-width:900px){
  .tl-root-header{min-height:auto;padding-top:12px;padding-bottom:12px}
  .root-actions,.navright,.tl-global-right{flex-wrap:wrap!important;white-space:normal!important}
  .tl-role-nav{flex-wrap:wrap!important}
}

</style>

    K6:["captured","Обоснование решения"],

const compOf={K1:"cognitive",K2:"cognitive",K3:"cognitive",K4:"cognitive",K5:"cognitive",K6:"cognitive",
SC1:"social",SC2:"social",SC3:"social",SC4:"social",SC5:"social",SC6:"social",SC7:"social",
DL1:"digital",DL2:"digital",DL3:"digital",DL4:"digital",DL5:"digital",DL6:"digital",DL7:"digital",
RR1:"reflective",RR2:"reflective",RR3:"reflective",RR4:"reflective",RR5:"reflective",RR6:"reflective",RR7:"reflective",RR8:"reflective"};

function getLang(){let l=localStorage.getItem("tl_lang")||"ru";return I18N[l]?l:"ru"}
function labDone(n){return !!localStorage.getItem(`tl-lab${n}-case01`)}

function evidenceForLab2(){
  const r=JSON.parse(localStorage.getItem("tl-lab2-case01")||"null"); if(!r)return [];
  return Object.entries(r.evidence||{}).filter(([,v])=>v?.status==="captured"||v?.status==="candidate").map(([id,v])=>({id,status:v.status,label:id}));
}
function evidenceForLab34(n){
  const r=JSON.parse(localStorage.getItem(`tl-lab${n}-case01`)||"null"); if(!r)return [];
  // Existing lab records contain the selected options and reasons.
  const out=[];
  if(n===3){
    const A=r.A,B=r.B,C=r.C;
    if(A===2) out.push({id:"SC2",status:"candidate"},{id:"K2",status:"candidate"});
    if(B===2) out.push({id:"SC3",status:"candidate"},{id:"SC4",status:"candidate"});
    if(C===2) out.push({id:"SC6",status:"candidate"},{id:"RR6",status:"candidate"});
    if((r.aReason||"").length>=20) out.push({id:"SC?R",status:"candidate"});
  }
  if(n===4){
    const p=r.picks||{};
    if(p[1]===2) out.push({id:"DL1",status:"candidate"});
    if(p[2]===2) out.push({id:"DL2",status:"candidate"});
    if(p[3]===2) out.push({id:"DL3",status:"candidate"});
    if(p[4]===2) out.push({id:"DL6",status:"candidate"},{id:"DL5",status:"candidate"});
    if((r.reasons||[]).some(x=>(x||"").length>=20)) out.push({id:"DL7",status:"candidate"});
  }
  return out.filter(x=>!x.id.includes("?"));
}
function evidenceForLab5(){
  const r=JSON.parse(localStorage.getItem("tl-lab5-case01")||"null"); if(!r)return [];
  const p=r.picks||{}; const out=[];
  if(p[1]===2)out.push({id:"RR2",status:"candidate"});
  if(p[2]===2)out.push({id:"RR3",status:"candidate"});
  if(p[3]===2)out.push({id:"RR5",status:"candidate"});
  if(p[4]===2)out.push({id:"RR6",status:"candidate"});
  if(p[5]===2)out.push({id:"RR7",status:"candidate"});
  return out;
}
function buildEvidence(){
  const out=[...evidenceForLab2(),...evidenceForLab34(3),...evidenceForLab34(4),...evidenceForLab5()];
  const seen=new Map();
  out.forEach(e=>seen.set(e.id,e.status==="captured"?"captured":(seen.get(e.id)||"candidate")));
  return [...seen.entries()].map(([id,status])=>({id,status}));
}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function render(){
  const lang=getLang(), x=I18N[lang];
  document.documentElement.lang=lang==="ru"?"ru":lang==="en"?"en":"uz";
  ["eyebrow","title","lead","noticeTitle","noticeText","completedLabel","evidenceLabel","candidateLabel","scoreLabel","backHome","homeLink","footer"].forEach(id=>document.getElementById(id).textContent=x[id]);
  document.getElementById("lang").value=lang;
  const completed=[1,2,3,4,5].filter(labDone).length, evidence=buildEvidence();
  document.getElementById("completed").textContent=completed+" / 5";
  document.getElementById("evidenceCount").textContent=evidence.filter(e=>e.status==="captured").length;
  document.getElementById("candidateCount").textContent=evidence.filter(e=>e.status==="candidate").length;

  const byComp={cognitive:[],social:[],digital:[],reflective:[]};
  evidence.forEach(e=>{if(compOf[e.id])byComp[compOf[e.id]].push(e)});
  const cards=document.getElementById("cards");
  cards.innerHTML=[1,2,3,4,5].map(n=>{
    const l=x.labs[n], done=labDone(n), ev=n===2?evidenceForLab2():n===3?evidenceForLab34(3):n===4?evidenceForLab34(4):n===5?evidenceForLab5():[];
    const cap=ev.filter(e=>e.status==="captured"), cand=ev.filter(e=>e.status==="candidate");
    const percent=done?100:0;
    return `<article class="card"><h2>${esc(l[0])} · ${esc(l[1])}</h2><div class="sub">${esc(l[2])}</div>
      <span class="status ${done?'done':'todo'}">${done?x.module.done:x.module.todo}</span>
      <div class="meter"><i style="width:${percent}%"></i></div>
      ${done?`<div class="evidence"><span class="tag">${cap.length} ${x.module.evidence}</span><span class="tag candidate">${cand.length} ${x.module.candidate}</span></div>`:`<div class="empty">${x.module.open}</div>`}
      ${done&&ev.length?`<details class="details"><summary>${x.details}</summary><ul>${ev.map(e=>`<li><strong>${esc(e.id)}</strong> — ${esc(e.status==="captured"?x.module.done:x.module.candidate)}</li>`).join("")}</ul></details>`:""}
      <div class="actions"><a class="btn" href="${l[3]}">${x.module.open}</a></div></article>`;
  }).join("");
}
document.getElementById("lang").addEventListener("change",e=>{localStorage.setItem("tl_lang",e.target.value);render()});
document.getElementById("lang").value=getLang();
render();
</script>

<script>
(function(){
  const NAV_TEXT={
    ru:{studentRole:"Студент",labLink:"Лаборатория",profileLinkNav:"Мой профиль",teacherRole:"Преподаватель",teacherLinkNav:"Кабинет"},
    "uz-lat":{studentRole:"Talaba",labLink:"Laboratoriya",profileLinkNav:"Mening profilim",teacherRole:"O‘qituvchi",teacherLinkNav:"Kabinet"},
    "uz-cyr":{studentRole:"Талаба",labLink:"Лаборатория",profileLinkNav:"Менинг профилим",teacherRole:"Ўқитувчи",teacherLinkNav:"Кабинет"},
    en:{studentRole:"Student",labLink:"Laboratory",profileLinkNav:"My profile",teacherRole:"Teacher",teacherLinkNav:"Dashboard"}
  };
  function current(){const l=localStorage.getItem("tl_lang")||"ru";return NAV_TEXT[l]?l:"ru"}
  function paint(){
    const x=NAV_TEXT[current()];
    document.querySelectorAll("[data-global]").forEach(el=>{
      const key=el.getAttribute("data-global"); if(x[key]) el.textContent=x[key];
    });
    document.querySelectorAll("[data-page]").forEach(el=>{
      el.classList.toggle("active",el.getAttribute("data-page")===(document.body.getAttribute("data-page")||"lab"));
    });
  }
  document.addEventListener("DOMContentLoaded",()=>{
    const sel=document.getElementById("lang")||document.getElementById("languageSelect");
    if(sel){
      const shared=localStorage.getItem("tl_lang");
      if(shared && [...sel.options].some(o=>o.value===shared)) sel.value=shared;
      sel.addEventListener("change",()=>{localStorage.setItem("tl_lang",sel.value);paint()});
    }
    paint();
  });
  window.addEventListener("storage",paint);
})();
</script>
<script src="demo.js"></script>

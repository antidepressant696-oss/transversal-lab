<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transversal Lab</title>
  <style>
    :root{
      --bg:#f6faf9;--panel:#fff;--text:#17312e;--muted:#647773;
      --line:#dce9e6;--accent:#2f7d73;--soft:#e9f4f1;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:34px 20px 18px;max-width:1120px;margin:auto}
    .top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
    .brand{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
    h1{margin:10px 0 8px;font-size:34px;line-height:1.12}
    .lead{max-width:780px;color:var(--muted);font-size:16px;line-height:1.6}
    .lang-wrap{min-width:96px}
    .root-actions{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.tl-role-nav-wrap{padding-bottom:2px}
    .lang-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--text)}
    main{max-width:1120px;margin:0 auto;padding:0 20px 48px}
    .notice{background:var(--soft);border:1px solid #cfe5e1;border-radius:16px;padding:18px 20px;margin:18px 0 28px;line-height:1.55}
    .notice strong{display:block;margin-bottom:6px}
    .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
    .card{grid-column:span 2;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;min-height:282px}
    .card:nth-child(4){grid-column:2 / span 2}
    .card:nth-child(5){grid-column:4 / span 2}
    .num{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .card h2{margin:8px 0 8px;font-size:22px;line-height:1.22;min-height:54px}
    .tag{display:block;padding:7px 10px;border-radius:999px;background:#f0f6f5;color:#355b56;font-size:12px;line-height:1.4;margin:0 0 12px}
    .card p{color:var(--muted);line-height:1.55;margin:0 0 16px;flex:1}
    .go{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:11px 14px;border-radius:10px;font-weight:750}
    .go:hover{background:#286d64}
    .profile{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
    .profile h2{margin-top:0}
    .profile-intro{color:var(--muted);line-height:1.6}
    .row{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line);line-height:1.5}
    .row:first-of-type{border-top:0}
    footer{max-width:1120px;margin:auto;padding:0 20px 40px;color:var(--muted);font-size:13px;line-height:1.6}
    @media(max-width:800px){
      .grid{grid-template-columns:1fr}
      .card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}
      .top{flex-direction:column}
      .lang-wrap{width:160px}
    }
    @media(max-width:560px){
      h1{font-size:29px}
      .row{grid-template-columns:1fr}
    }
  
/* ===== Global role navigation ===== */
.tl-role-nav{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tl-role-label{font-size:10px;line-height:1;color:var(--muted,#647773);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.tl-nav-link{display:inline-flex;align-items:center;min-height:32px;padding:7px 9px;border-radius:9px;color:var(--text,#17312e);text-decoration:none;font-size:13px;font-weight:700}
.tl-nav-link:hover{background:var(--soft,#e9f4f1)}
.tl-nav-link.active{background:var(--soft,#e9f4f1);color:var(--accent,#2f7d73)}
.tl-divider{width:1px;height:22px;background:var(--line,#dce9e6);margin:0 4px}
@media(max-width:900px){.tl-role-nav{justify-content:flex-end;gap:5px}.tl-role-label{width:100%;text-align:right;margin:3px 0 0}.tl-divider{display:none}}


/* v1.5 navigation stability: CSS-only fix */
.tl-header{position:sticky!important;top:0!important;z-index:2000!important;background:#fff!important}
.tl-root-header{width:min(1160px,100%);margin:0 auto;min-height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.root-actions,.navright{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:10px!important;flex-wrap:nowrap!important;position:relative!important;z-index:2100!important}
.root-actions>* , .navright>*{position:relative!important;z-index:2101!important;pointer-events:auto!important}
.tl-role-nav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;flex-wrap:nowrap!important;position:relative!important;z-index:2101!important}
.tl-nav-link{position:relative!important;z-index:2102!important;pointer-events:auto!important;cursor:pointer!important}
.tl-global-right{position:relative!important;z-index:2102!important;pointer-events:auto!important;display:flex!important;align-items:center!important;gap:10px!important;white-space:nowrap!important}
.tl-global-link,.tl-global-lang{position:relative!important;z-index:2103!important;pointer-events:auto!important;cursor:pointer!important}
@media(max-width:900px){
  .tl-root-header{min-height:auto;padding-top:12px;padding-bottom:12px}
  .root-actions,.navright,.tl-global-right{flex-wrap:wrap!important;white-space:normal!important}
  .tl-role-nav{flex-wrap:wrap!important}
}

</style>
</head>

</header>

function render(lang){
  const t=T[lang] || T.ru;
  document.documentElement.lang = lang==="uz-cyr" || lang==="uz-lat" ? "uz" : lang;
  document.getElementById("title").textContent=t.title;
  document.getElementById("lead").textContent=t.lead;
  document.getElementById("langLabel").textContent=t.langLabel;

  document.getElementById("noticeTitle").textContent=t.noticeTitle;
  document.getElementById("noticeText").textContent=t.noticeText;
  document.getElementById("profileTitle").textContent=t.profileTitle;
  document.getElementById("profileText").textContent=t.profileText;
  document.getElementById("footer").textContent=t.footer;

  document.getElementById("labs").innerHTML = t.labs.map(x => `
    <article class="card">
      <div class="num">${x[0]}</div>
      <h2>${x[1]}</h2>
      <div class="tag">${x[2]}</div>
      <p>${x[3]}</p>
      <a class="go" href="${x[5]}">${x[4]}</a>
    </article>
  `).join("");

  document.getElementById("profileRows").innerHTML = t.components.map(x => `
    <div class="row">
      <strong>${x[0]}</strong>
      <span>${x[1]}</span>
    </div>
  `).join("");

  localStorage.setItem("tl_lang", lang);
}

const saved = localStorage.getItem("tl_lang") || "ru";
document.getElementById("lang").value=saved;
render(saved);
document.getElementById("lang").addEventListener("change",e=>render(e.target.value));
</script>

<script>
(function(){
  const NAV_TEXT={
    ru:{studentRole:"Студент",labLink:"Лаборатория",profileLinkNav:"Мой профиль",teacherRole:"Преподаватель",teacherLinkNav:"Кабинет"},
    "uz-lat":{studentRole:"Talaba",labLink:"Laboratoriya",profileLinkNav:"Mening profilim",teacherRole:"O‘qituvchi",teacherLinkNav:"Kabinet"},
    "uz-cyr":{studentRole:"Талаба",labLink:"Лаборатория",profileLinkNav:"Менинг профилим",teacherRole:"Ўқитувчи",teacherLinkNav:"Кабинет"},
    en:{studentRole:"Student",labLink:"Laboratory",profileLinkNav:"My profile",teacherRole:"Teacher",teacherLinkNav:"Dashboard"}
  };
  function current(){const l=localStorage.getItem("tl_lang")||"ru";return NAV_TEXT[l]?l:"ru"}
  function paint(){
    const x=NAV_TEXT[current()];
    document.querySelectorAll("[data-global]").forEach(el=>{
      const key=el.getAttribute("data-global"); if(x[key]) el.textContent=x[key];
    });
    document.querySelectorAll("[data-page]").forEach(el=>{
      el.classList.toggle("active",el.getAttribute("data-page")===(document.body.getAttribute("data-page")||"lab"));
    });
  }
  document.addEventListener("DOMContentLoaded",()=>{
    const sel=document.getElementById("lang")||document.getElementById("languageSelect");
    if(sel){
      const shared=localStorage.getItem("tl_lang");
      if(shared && [...sel.options].some(o=>o.value===shared)) sel.value=shared;
      sel.addEventListener("change",()=>{localStorage.setItem("tl_lang",sel.value);paint()});
    }
    paint();
  });
  window.addEventListener("storage",paint);
})();
</script>
